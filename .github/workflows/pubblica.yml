name: Pubblica su dao-arts.it

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', 'src/**', 'package*.json', '.github/workflows/pubblica.yml']
  schedule:
    - cron: '*/30 5-21 * * *'
    - cron: '41 2 * * *'

concurrency:
  group: pubblica
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      cambiato: ${{ steps.esito.outputs.cambiato }}
      chiave: ${{ steps.stato.outputs.chiave }}
      pronto: ${{ steps.stato.outputs.pronto }}
    steps:
      - id: stato
        run: |
          curl -fsS --retry 3 -A 'Mozilla/5.0' 'https://www.dao-arts.it/aggiorna-copia.php?stato' | grep -q '"versione"' || exit 0
          echo "pronto=true" >> "$GITHUB_OUTPUT"
          s=$(curl -fsS --retry 3 -A 'Mozilla/5.0' -H 'Cookie: origine=1' https://www.dao-arts.it/sitemap_index.xml | grep -o '<lastmod>[^<]*' | sort | tr -d '\n') || true
          c=$(curl -fsS --retry 3 -A 'Mozilla/5.0' 'https://www.dao-arts.it/wp-json/wp/v2/comments?per_page=20&_fields=id,date') || true
          [ -n "$s" ] && [ -n "$c" ] || exit 0
          echo "chiave=stato-$(printf '%s|%s|%s' "$s" "$c" "$GITHUB_SHA" | sha256sum | cut -c1-24)" >> "$GITHUB_OUTPUT"
      - id: visto
        if: steps.stato.outputs.chiave != ''
        uses: actions/cache/restore@v6
        with:
          path: .stato
          key: ${{ steps.stato.outputs.chiave }}
          lookup-only: true
      - id: esito
        run: echo "cambiato=${{ github.event_name == 'push' || steps.stato.outputs.chiave != '' && (github.event_name == 'workflow_dispatch' || steps.visto.outputs.cache-hit != 'true' || github.event.schedule == '41 2 * * *') }}" >> "$GITHUB_OUTPUT"

  pubblica:
    needs: controllo
    if: needs.controllo.outputs.cambiato == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRONTO: ${{ needs.controllo.outputs.pronto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          pip install beautifulsoup4 pillow fonttools brotli playwright
          python -m playwright install --with-deps chromium
          npm ci
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: build-${{ github.run_id }}
          restore-keys: build-
      - run: python3 tools/mirror.py
      - run: BASE=/ tools/build.sh
      - run: python3 tools/pacchi.py
      - uses: actions/cache/save@v6
        with:
          path: .cache
          key: build-${{ github.run_id }}
      - if: env.PRONTO == 'true'
        run: |
          gh release view copia > /dev/null 2>&1 || gh release create copia --title copia --notes '' --latest=false
          gia=$(gh release view copia --json assets --jq '.assets[].name')
          for f in pacchi/*.zip; do
            grep -qx "$(basename "$f")" <<< "$gia" || gh release upload copia "$f"
          done
          gh release upload copia pacchi/manifest.json --clobber
      - if: env.PRONTO == 'true'
        run: |
          for i in $(seq 1 40); do
            r=$(curl -sS --max-time 170 -A 'Mozilla/5.0' https://www.dao-arts.it/aggiorna-copia.php) || r='{}'
            echo "$r"
            [ "$(jq -r '.mancanti // empty' <<< "$r" 2>/dev/null)" = 0 ] && break
            sleep 5
          done
          [ "$(jq -r '.mancanti // empty' <<< "$r" 2>/dev/null)" = 0 ]
      - if: env.PRONTO == 'true'
        run: |
          gh release view copia --json assets --jq '.assets[].name' | grep '\.zip$' | while read -r n; do
            grep -q "\"$n\"" pacchi/manifest.json || gh release delete-asset copia "$n" -y
          done
      - if: needs.controllo.outputs.chiave != ''
        run: mkdir -p .stato && date > .stato/ultima
      - if: needs.controllo.outputs.chiave != ''
        uses: actions/cache/save@v6
        with:
          path: .stato
          key: ${{ needs.controllo.outputs.chiave }}
