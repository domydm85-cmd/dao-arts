name: Copia di dao-arts.it

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          pip install beautifulsoup4 pillow fonttools brotli playwright
          python -m playwright install --with-deps chromium
          npm ci
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: build-${{ github.run_id }}
          restore-keys: build-
      - run: python3 tools/mirror.py
      - run: BASE=/ tools/build.sh
      - run: python3 tools/pacchi.py
      - uses: actions/upload-artifact@v7
        with:
          name: copia
          path: pacchi/
          compression-level: 0
          retention-days: 7
      - uses: actions/cache/save@v6
        with:
          path: .cache
          key: build-${{ github.run_id }}
